name: Build LaTeX PDF

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: mötesprotokoll.tex

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: mötesprotokoll-pdf
          path: mötesprotokoll.pdf
