name: Build and Publish LaTeX PDF

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: mötesprotokoll.tex

      - name: Prepare website
        run: |
          mkdir public
          cp mötesprotokoll.pdf public/index.pdf
          cat > public/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="sv">
          <head>
            <meta charset="UTF-8">
            <title>Mötesprotokoll</title>
          </head>
          <body>
            <h1>Mötesprotokoll</h1>
            <p>
              <a href="index.pdf">Öppna PDF</a>
            </p>
            <iframe
              src="index.pdf"
              width="100%"
              height="800px">
            </iframe>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
